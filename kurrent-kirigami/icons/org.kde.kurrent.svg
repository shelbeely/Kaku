<?xml version="1.0" encoding="UTF-8"?>
<!-- Kurrent Terminal application icon -->
<!-- SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background rounded rectangle -->
  <rect x="4" y="4" width="40" height="40" rx="6" ry="6"
        fill="#1d1d2b" stroke="#3daee9" stroke-width="1.5"/>
  <!-- Terminal prompt chevron > -->
  <polyline points="14,16 22,24 14,32"
            fill="none" stroke="#3daee9" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor/underscore _ -->
  <line x1="24" y1="32" x2="36" y2="32"
        stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
</svg>
