[package]
name = "kde-frameworks"
version = "0.1.0"
edition = "2021"
authors = ["Kurrent Contributors"]
license = "MIT"
description = "KDE Plasma integration for Kurrent terminal"

[dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For DBus communication with KDE services
zbus = "4.0"

# For parsing KDE config files
ini = "1.3"

# For directory/path operations
dirs = "5.0"

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
# Enable all KDE integrations
full = ["notifications", "wallet", "activities", "color-scheme"]

# Individual feature flags for incremental implementation
notifications = []  # KNotifications integration
wallet = []         # KWallet integration
activities = []     # Plasma Activities support
color-scheme = []   # KDE color scheme detection
